; FasterEdge MCU (CH32V003) — platformio_ide 版
; VS Code + PlatformIO 插件直接打开本目录即可编译/烧录/监视串口
; 本版本为「裸机 C + 寄存器级参考实现（WCH CH32V003 平台）」
;
; 使用方法（VS Code）:
;   1. 安装 PlatformIO IDE 插件
;   2. 打开本目录 (platformio_ide)
;   3. 底部状态栏点 Build / Upload / Serial Monitor
;
; 注意:
;   - WCH 平台需要安装 MounRiver Studio 工具链（pio 会自动下载）
;   - fe_port.c 为 CH32V003 寄存器级参考实现（RCC/GPIO/USART/TIM）
;   - 引脚/寄存器名以 WCH 官方头文件为准，如有差异请按头文件微调
[env:ch32v003f4p6]
platform = ch32v003
board = ch32v003f4p6
framework = none
monitor_speed = 115200
build_flags =
    -DFOSC=48000000UL
